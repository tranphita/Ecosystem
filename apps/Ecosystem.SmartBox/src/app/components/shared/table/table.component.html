<div class="table-responsive">
    <table mat-table [dataSource]="dataSource" matSort class="w-100">
        <ng-container *ngFor="let col of columns" [matColumnDef]="getColumnKeyAsString(col.key)">
            <th mat-header-cell *matHeaderCellDef 
                [mat-sort-header]="col.sortable ? getColumnKeyAsString(col.key) : ''"
                [style.cursor]="col.sortable ? 'pointer' : 'default'">
                {{ col.label }}
            </th>
            <td mat-cell *matCellDef="let element">
                <!-- Xử lý hiển thị cho các cột đặc biệt -->
                <ng-container *ngIf="col.cell; else defaultCell">
                    <ng-container *ngIf="isNameWithAvatar(col.cell(element)); else defaultCellValue">
                        <div class="d-flex align-items-center">
                            <img class="rounded-circle" [src]="col.cell(element).imagePath" width="40" />
                            <div class="m-l-16">
                                <p class="f-w-600 mat-subtitle-1 f-s-16 m-t-0">
                                    {{ col.cell(element).name }}
                                </p>
                                <small class="mat-body-1 f-s-14">{{ col.cell(element).position }}</small>
                            </div>
                        </div>
                    </ng-container>
                    <ng-template #defaultCellValue>
                        {{ col.cell(element) }}
                    </ng-template>
                </ng-container>
                <ng-template #defaultCell>
                    {{ getCellValue(element, col.key) }}
                </ng-template>
            </td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Action</th>
            <td mat-cell *matCellDef="let element" class="action-link">
                <a (click)="onActionClick('edit', element)" class="m-r-10 cursor-pointer"><i-tabler name="edit"
                        class="icon-18"></i-tabler></a>
                <a (click)="onActionClick('delete', element)" class="m-r-10 cursor-pointer">
                    <i-tabler name="trash" class="icon-18"></i-tabler>
                </a>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
<mat-paginator [length]="dataSource.data.length" [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
